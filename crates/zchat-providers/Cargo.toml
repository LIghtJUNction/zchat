["package"]
"name" = "zchat-providers"
"version" = "0.1.2"
"edition" = "2024"
"rust-version" = "1.100"
"license" = "MIT"
"description" = "Native protocol adapters for the zchat unified messaging platform"
"repository" = "https://github.com/LIghtJUNction/zchat"
"readme" = "README.md"
"include" = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

["lib"]
"crate-type" = ["rlib", "cdylib"]

["dependencies"]

["dependencies"."zchat-core"]
"path" = "../zchat-core"
"version" = "=0.1.2"

["dependencies"."zchat-plugin-api"]
"path" = "../zchat-plugin-api"
"version" = "=0.1.2"

["dependencies"."zplugin"]
"git" = "https://github.com/LIghtJUNction/zplugin.git"
"features" = ["std", "macros"]

["dependencies"."zsys"]
"git" = "https://github.com/LIghtJUNction/zsys.git"
"features" = ["dylib"]

["dependencies"."tungstenite"]
"version" = "0.30.0"
"default-features" = false
"features" = ["handshake"]
