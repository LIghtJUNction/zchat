["package"]
"name" = "zchat"
"version" = "0.1.3"
"edition" = "2024"
"rust-version" = "1.100"
"description" = "A native, plugin-based messaging workspace with a unified AI interface"
"license" = "MIT"
"authors" = ["LIghtJUNction"]
"repository" = "https://github.com/LIghtJUNction/zchat"
"readme" = "README.md"
"keywords" = ["messaging", "mcp", "plugins", "chat", "project-z"]
"categories" = ["network-programming", "command-line-utilities", "gui"]
"include" = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "CHANGELOG.md", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]

["workspace"]
"resolver" = "3"
"members" = [".", "crates/zchat-core", "crates/zchat-plugin-api", "crates/zchat-providers"]

["features"]
"default" = ["gui"]
"gui" = ["dep:zgpui", "zgpui/native"]
"linux-software" = ["gui", "zgpui/linux-software"]

["dependencies"]

["dependencies"."zchat-core"]
"path" = "crates/zchat-core"
"version" = "=0.1.3"

["dependencies"."zchat-plugin-api"]
"path" = "crates/zchat-plugin-api"
"version" = "=0.1.3"

["dependencies"."zchat-providers"]
"path" = "crates/zchat-providers"
"version" = "=0.1.3"

["dependencies"."zgpui"]
"git" = "https://github.com/LIghtJUNction/zgpui.git"
"optional" = true

["dependencies"."zplugin"]
"git" = "https://github.com/LIghtJUNction/zplugin.git"
"features" = ["std", "macros"]

["dependencies"."zmcpio"]
"git" = "https://github.com/LIghtJUNction/zmcpio.git"
"features" = ["std"]

["profile"]

["profile"."release"]
"lto" = "thin"
"codegen-units" = 1
"strip" = true

["lints"]

["lints"."rust"]
"unsafe_op_in_unsafe_fn" = "deny"
